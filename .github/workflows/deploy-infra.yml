name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'nonprod'
        type: choice
        options:
          - nonprod
          - prod
      deployFabric:
        description: 'Deploy Fabric Capacity?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  AZURE_RESOURCE_GROUP: rg-claims-rules-${{ github.event.inputs.environment }}
  AZURE_LOCATION: westus2

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Create Resource Group
      run: |
        az group create \
          --name ${{ env.AZURE_RESOURCE_GROUP }} \
          --location ${{ env.AZURE_LOCATION }}

    - name: Deploy Bicep (without Fabric)
      if: github.event.inputs.deployFabric == 'false'
      run: |
        az deployment group create \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --template-file infra/main.bicep \
          --parameters '@infra/params.json' \
          --parameters fabricCapacityAdminId='' \
          --parameters staticWebAppName='claims-portal-swa-${{ github.event.inputs.environment }}' \
          --parameters fabricLocation='centralus'

    - name: Deploy Bicep (with Fabric)
      if: github.event.inputs.deployFabric == 'true'
      run: |
        az deployment group create \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --template-file infra/main.bicep \
          --parameters '@infra/params.json' \
          --parameters fabricCapacityAdminId='${{ secrets.FABRIC_ADMIN_PRINCIPAL_ID }}' \
          --parameters staticWebAppName='claims-portal-swa-${{ github.event.inputs.environment }}' \
          --parameters fabricLocation='centralus'

    - name: Get Deployment Outputs
      id: outputs
      run: |
        FUNCTION_APP=$(az deployment group show \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --name main \
          --query properties.outputs.functionAppName.value -o tsv)
        
        FHIR_ENDPOINT=$(az deployment group show \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --name main \
          --query properties.outputs.fhirServerUrl.value -o tsv)
        
        echo "function-app-name=$FUNCTION_APP" >> $GITHUB_OUTPUT
        echo "fhir-endpoint=$FHIR_ENDPOINT" >> $GITHUB_OUTPUT

    - name: Summary
      run: |
        echo "## Deployment Complete ✓" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Resource Group**: ${{ env.AZURE_RESOURCE_GROUP }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Function App**: ${{ steps.outputs.outputs.function-app-name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **FHIR Endpoint**: ${{ steps.outputs.outputs.fhir-endpoint }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Fabric Deployed**: ${{ github.event.inputs.deployFabric }}" >> $GITHUB_STEP_SUMMARY
